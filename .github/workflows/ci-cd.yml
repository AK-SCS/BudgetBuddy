name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  # Backend Tests and Build
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./BudgetBuddy
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./BudgetBuddy
    
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal
      working-directory: ./BudgetBuddy
    
    - name: Publish
      run: dotnet publish --no-build --configuration Release --output ./publish
      working-directory: ./BudgetBuddy
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-artifact
        path: ./BudgetBuddy/publish

  # ML Service Tests
  ml-service:
    name: ML Service - Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
      working-directory: ./BudgetBuddy-ml-service
    
    - name: Run linting
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      working-directory: ./BudgetBuddy-ml-service
    
    - name: Run tests
      run: pytest --cov=. --cov-report=xml
      working-directory: ./BudgetBuddy-ml-service
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./BudgetBuddy-ml-service/coverage.xml
        flags: ml-service

  # Frontend Build and Test
  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./budgetbuddyweb/package-lock.json
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./budgetbuddyweb
    
    - name: Run linting
      run: npm run lint
      working-directory: ./budgetbuddyweb
    
    - name: Build
      run: npm run build
      working-directory: ./budgetbuddyweb
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-artifact
        path: ./budgetbuddyweb/dist

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Docker Build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, ml-service, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/budgetbuddy-backend:latest
    
    - name: Build and push ML Service
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.ml
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/budgetbuddy-ml:latest
    
    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/budgetbuddy-frontend:latest

  # Deploy (example for production)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "Deployment step - configure your deployment target here"
        echo "Examples: Azure App Service, AWS ECS, Kubernetes, etc."
