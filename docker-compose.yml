version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: budgetbuddy-postgres
    environment:
      POSTGRES_DB: budgetbuddy
      POSTGRES_USER: ${POSTGRES_USER:-budgetbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetbuddy-network

  # ML Service
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: budgetbuddy-ml
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost:5206
      - LOG_LEVEL=INFO
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./BudgetBuddy-ml-service/models:/app/models:ro
      - ml_logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - budgetbuddy-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: budgetbuddy-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
      - POSTGRES_CONNECTION_STRING=Host=postgres;Database=budgetbuddy;Username=${POSTGRES_USER:-budgetbuddy};Password=${POSTGRES_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-BudgetBuddyAPI}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-BudgetBuddyClient}
      - ML_SERVICE_BASE_URL=http://ml-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost:3000
      - RATE_LIMIT_REQUESTS_PER_MINUTE=100
    volumes:
      - backend_logs:/app/logs
    ports:
      - "5206:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - budgetbuddy-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: budgetbuddy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - budgetbuddy-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  ml_logs:
    driver: local

networks:
  budgetbuddy-network:
    driver: bridge
