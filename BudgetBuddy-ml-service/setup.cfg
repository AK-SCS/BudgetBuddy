[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    .eggs,
    *.egg,
    build,
    dist
ignore = E203, W503
per-file-ignores =
    __init__.py:F401

[pycodestyle]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv

[isort]
profile = black
line_length = 100
skip = .git,__pycache__,.venv,venv

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
