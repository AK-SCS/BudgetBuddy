version: '3.8'

services:
  # ML Service (Development)
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: budgetbuddy-ml-dev
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5206
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=development
    volumes:
      - ./BudgetBuddy-ml-service:/app
      - ml_logs:/app/logs
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - budgetbuddy-dev-network

  # Backend API (Development with SQLite)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: budgetbuddy-backend-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_TYPE=sqlite
      - SQLITE_CONNECTION_STRING=Data Source=/app/Data/budgetbuddy.db
      - JWT_SECRET=development-secret-key-minimum-32-characters-long-for-testing
      - JWT_ISSUER=BudgetBuddyAPI
      - JWT_AUDIENCE=BudgetBuddyClient
      - ML_SERVICE_BASE_URL=http://ml-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
    volumes:
      - ./BudgetBuddy:/src/BudgetBuddy
      - backend_data:/app/Data
      - backend_logs:/app/logs
    ports:
      - "5206:8080"
    depends_on:
      - ml-service
    networks:
      - budgetbuddy-dev-network

  # Frontend (Development with hot reload)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: build
    container_name: budgetbuddy-frontend-dev
    environment:
      - VITE_API_BASE_URL=http://localhost:5206
      - VITE_ML_API_BASE_URL=http://localhost:8000
      - VITE_DEFAULT_REGION=GB
    volumes:
      - ./budgetbuddyweb:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - budgetbuddy-dev-network

volumes:
  backend_data:
    driver: local
  backend_logs:
    driver: local
  ml_logs:
    driver: local

networks:
  budgetbuddy-dev-network:
    driver: bridge
